name: Generate Profile Stats
on:
  schedule:
    - cron: "0 0 * * *"   # runs every day at midnight
  workflow_dispatch:        # lets you run it manually too
jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # Generate GitHub Stats SVG
      - uses: anuraghazra/github-readme-stats@latest
        with:
          username: devadi1611
          output_path: assets/stats.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Generate Streak Stats SVG  
      - uses: DenverCoder1/github-readme-streak-stats-action@v1
        with:
          user: devadi1611
          output_path: assets/streak.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Generate Snake
      - uses: Platane/snk@v3
        with:
          github_user_name: devadi1611
          outputs: assets/snake-dark.svg?palette=github-dark

      # Commit all generated files
      - uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "chore: update profile stats"
